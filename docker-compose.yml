version: '3.9'

services:
  iris-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: IRIS-Scanner
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: iris_db
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: iris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: iris_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
