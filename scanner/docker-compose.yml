services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iris-ai-file-scanner
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    volumes:
      - ./app:/app/app:ro
